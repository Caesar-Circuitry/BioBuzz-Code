repositories {
    mavenCentral()
    google()

    maven {
        url = uri("https://maven.brott.dev/")
    }

    maven {
        url = uri("https://www.jitpack.io")
    }

    maven {
        url = uri("https://repo.dairy.foundation/releases")
    }

    maven {
        url = uri("https://repo.dairy.foundation/snapshots")
    }
}

dependencies {
    implementation "org.firstinspires.ftc:Inspection:11.2.1"
    implementation "org.firstinspires.ftc:Blocks:11.2.1"
    //noinspection Aligned16KB
    implementation "org.firstinspires.ftc:RobotCore:11.2.1"
    implementation "org.firstinspires.ftc:RobotServer:11.2.1"
    implementation "org.firstinspires.ftc:OnBotJava:11.2.1"
    implementation "org.firstinspires.ftc:Hardware:11.2.1"
    implementation "org.firstinspires.ftc:FtcCommon:11.2.1"
    implementation "org.firstinspires.ftc:Vision:11.2.1"

    //noinspection AndroidElementNotAllowedInResources
    implementation "androidx.appcompat:appcompat:1.2.0"
    implementation "dev.frozenmilk.dairy:CachingHardware:1.0.0"

    implementation("org.codeblooded.ftcodesim:ftcodesim:v0.1.0-alpha.1")

    implementation "com.acmerobotics.dashboard:dashboard:0.6.0"

    implementation "org.psilynx.psikit:core:0.2.0-beta2"
    implementation "org.psilynx.psikit:ftc:0.2.0-beta2"

    implementation 'com.pedropathing:ftc:2.1.2'
    implementation 'com.pedropathing:telemetry:1.0.0'
    implementation 'com.pedropathing:ivy:1.1.1'

    testImplementation "junit:junit:4.13.2"
}